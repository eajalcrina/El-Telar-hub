<!-- Fuente del prototipo. La tipografía Mluvka se incrusta al publicar (marcador __MLUVKA__); sin ella usa la de respaldo. -->
<title>El Telar, el cerebro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Fredoka:wght@500;600&display=swap">
<style>
/* Pantalla única sobre blanco: tiras de código en grises entran desde todos los lados; un cabezal arma bloques por zonas y los conecta. El título queda libre al centro. */
@font-face { font-family: 'Mluvka'; src: url(data:font/woff2;base64,__MLUVKA__) format('woff2'); font-weight: 400; font-display: swap; }
:root {
  --fondo: #FCFCFB;
  --tinta: #111111;
  --tinta-2: #55524E;
  --gris: #8E8A84;
  --linea: rgba(17,17,17,0.12);
  --acento: #F32769;
  --acento-osc: #C4126A;
  --sans: 'Mluvka', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
#lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.capa { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.capa a, .capa button, .capa input, .capa form { pointer-events: auto; }
nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; max-width: 1280px; width: 100%; margin: 0 auto; }
.marca { margin: 0; font-size: 24px; letter-spacing: -0.02em; line-height: 1; }
.marca span { color: var(--acento); }
.nav-der { display: flex; align-items: center; gap: 22px; }
.nav-der a { color: var(--tinta-2); text-decoration: none; font-size: 15px; }
.nav-der a:hover { color: var(--tinta); }
.nav-der .cta { color: #FFFFFF; background: var(--tinta); border-radius: 999px; padding: 10px 18px; font-size: 14px; }
@media (max-width: 640px) { .nav-der a:not(.cta) { display: none; } }

main { display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; min-width: 0; }
.centro { width: 100%; max-width: 760px; text-align: center; padding-block: 12px; }
.rotulo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--tinta-2); margin: 0; }
h1 { font-size: clamp(34px, 5.4vw, 72px); line-height: 0.98; letter-spacing: -0.045em; font-weight: 400; margin: 16px 0 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--acento-osc); }
.llana { font-size: clamp(16px, 1.5vw, 19px); line-height: 1.5; color: var(--tinta-2); margin: 18px auto 0; max-width: 44ch; }
form { margin: 26px auto 0; max-width: 520px; }
.fila { display: flex; gap: 6px; padding: 5px; border: 1px solid var(--linea); border-radius: 999px; background: #FFFFFF; box-shadow: 0 10px 40px rgba(17,17,17,0.06); }
.fila:focus-within { border-color: var(--tinta); }
.fila input { flex: 1; min-width: 0; border: 0; background: transparent; height: 44px; padding: 0 16px; font-family: var(--sans); font-size: 16px; color: var(--tinta); }
.fila input:focus { outline: none; }
.fila button { border: 0; border-radius: 999px; background: var(--tinta); color: #FFFFFF; font-family: var(--sans); font-size: 16px; padding: 0 22px; cursor: pointer; }
.fila button:hover { background: var(--acento-osc); }
.fila button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.respuesta { min-height: 22px; margin: 12px 0 0; font-size: 15px; color: var(--tinta-2); }
.respuesta b { font-weight: 400; color: var(--tinta); }
.pie { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; max-width: 1280px; width: 100%; margin: 0 auto; padding-block: 14px 18px; }
.pie p { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gris); }
.opciones { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #FFFFFF; border: 1px solid var(--linea); pointer-events: auto; }
.opciones span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gris); padding: 0 8px 0 10px; }
.opciones button { font-family: var(--mono); font-size: 12px; border: 0; border-radius: 999px; background: transparent; color: var(--tinta-2); width: 32px; height: 32px; cursor: pointer; }
.opciones button[aria-pressed="true"] { background: var(--tinta); color: #FFFFFF; }
.opciones button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.pie { align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<canvas id="lienzo" aria-hidden="true"></canvas>
<div class="capa">
  <nav aria-label="Principal">
    <p class="marca">El Telar<span>.</span></p>
    <div class="nav-der">
      <a href="#">Cómo funciona</a>
      <a href="#">Piezas</a>
      <a class="cta" href="#">Conversemos</a>
    </div>
  </nav>
  <main>
    <div class="centro" id="centro">
      <p class="rotulo">El Telar, IA para empresas</p>
      <h1 id="titular">Tejemos el cerebro de tu empresa, <em>un proceso a la vez.</em></h1>
      <p class="llana" id="bajada">Conectamos lo que hoy vive en chats, Excels y correos, y lo convertimos en procesos con IA que funcionan.</p>
      <form id="form" autocomplete="off">
        <label class="sr" for="frase">¿Qué se le escapa a tu empresa cada semana?</label>
        <div class="fila">
          <input id="frase" maxlength="60" placeholder="¿Qué proceso conectamos primero?">
          <button type="submit">Conectar</button>
        </div>
      </form>
      <p class="respuesta" id="respuesta" aria-live="polite"></p>
    </div>
  </main>
  <div class="pie">
    <div class="opciones" role="group" aria-label="Opciones de titular"><span>Titular</span><button type="button" data-t="0" aria-pressed="true">1</button><button type="button" data-t="1" aria-pressed="false">2</button><button type="button" data-t="2" aria-pressed="false">3</button><button type="button" data-t="3" aria-pressed="false">4</button></div>
    <p>Un sistema de Redesign Lab</p>
  </div>
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('lienzo'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, CELL = 14, CW = 10;
  var GRIS = ['#C9C3BB', '#BBB5AC', '#D4CFC8', '#ADA79E']; var GL = 36;
  var TINTA = '#2A2826', ACENTO = '#F32769';
  var TIPOS = ['texto', 'numero', 'binario', 'cubo', 'rombo'];
  var PALABRAS = ['factura', 'contrato', 'acta', 'reclamo', 'póliza', 'cotización', 'reporte', 'planilla', 'correo', 'pedido', 'garantía', 'cierre'];
  var NOMBRES = ['cobranza', 'contratos', 'reportes', 'acuerdos'];
  var streams = [], blocks = [], particles = [], links = [], pulses = [];
  var head = { x: 0, y: 0, tx: 0, ty: 0, block: -1, cell: 0, wait: 0, mode: 'viaja', blink: 0 };
  var safe = { x: 0, y: 0, w: 0, h: 0 };
  var pointer = { x: -9999, y: -9999 };
  var fraseExtra = '';

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function glyph(tipo, i) {
    if (tipo === 'texto') { var w = PALABRAS[i % PALABRAS.length] + ' '; return w[i % w.length]; }
    if (tipo === 'numero') return String(Math.floor(Math.random() * 10));
    if (tipo === 'binario') return Math.random() < 0.5 ? '0' : '1';
    return tipo;
  }

  // ---------- Tiras de código ----------
  function edgePoint(side) {
    if (side === 0) return [rnd(-40, W + 40), -30];
    if (side === 1) return [W + 30, rnd(-40, H + 40)];
    if (side === 2) return [rnd(-40, W + 40), H + 30];
    return [-30, rnd(-40, H + 40)];
  }
  function makeStream() {
    var a = Math.floor(Math.random() * 4), b = (a + 1 + Math.floor(Math.random() * 3)) % 4;
    var p0 = edgePoint(a), p2 = edgePoint(b), p1 = [rnd(W * 0.15, W * 0.85), rnd(H * 0.15, H * 0.85)];
    var tipo = Math.random() < 0.4 ? 'texto' : pick(TIPOS);
    var len = Math.hypot(p2[0] - p0[0], p2[1] - p0[1]) * 1.15;
    var n = Math.floor(len / (GL * 0.95));
    var gl = []; for (var i = 0; i < n; i++) gl.push(glyph(tipo, i));
    return { p0: p0, p1: p1, p2: p2, tipo: tipo, gl: gl, n: n, off: Math.random(), speed: rnd(0.00002, 0.00005), color: pick(GRIS) };
  }
  function bez(s, u) {
    var a = 1 - u;
    return [a * a * s.p0[0] + 2 * a * u * s.p1[0] + u * u * s.p2[0], a * a * s.p0[1] + 2 * a * u * s.p1[1] + u * u * s.p2[1]];
  }

  // ---------- Bloques y zonas ----------
  function zonas() {
    var m = W < 700;
    var z = m ? [[0.08, 0.15], [0.42, 0.84]] : [[0.08, 0.2], [0.72, 0.46], [0.16, 0.78]];
    return z.map(function (p, i) {
      var word = (i === 0 && primera) ? primera : NOMBRES[i % NOMBRES.length];
      var cols = word.length, rows = 1, bw = cols * CW, bh = rows * CELL;
      var x = Math.round(p[0] * W), y = Math.round(p[1] * H);
      x = Math.min(Math.max(x, 26), W - bw - 26);
      return { x: x, y: y, cols: cols, rows: rows, w: bw, h: bh, cells: [], done: false, word: word, idx: i };
    });
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELL = W < 700 ? 17 : 21; CW = CELL * 0.66;
    var r = document.getElementById('centro').getBoundingClientRect();
    safe = { x: r.left - 30, y: r.top - 20, w: r.width + 60, h: r.height + 40 };
    GL = W < 700 ? 26 : 36; streams = []; var ns = W < 700 ? 7 : 13; for (var i = 0; i < ns; i++) streams.push(makeStream());
    start();
  }

  function start() {
    blocks = zonas(); particles = []; links = []; pulses = [];
    head.block = -1; head.mode = 'viaja'; head.x = W / 2; head.y = -20;
    nextBlock();
    if (reduce) { blocks.forEach(function (b) { fillAll(b); b.done = true; }); for (var i = 1; i < blocks.length; i++) links.push(makeLink(blocks[i - 1], blocks[i], 1)); }
  }
  function cellType(b, r) { return 'texto'; }
  function cellGlyph(b, r, c) { return b.word[c]; }
  var primera = '';
  function fillAll(b) { for (var r = 0; r < b.rows; r++) for (var c = 0; c < b.cols; c++) b.cells.push({ r: r, c: c, t: cellType(b, r), g: cellGlyph(b, r, c), a: 1 }); }
  function nextBlock() {
    head.block++;
    if (head.block >= blocks.length) { head.mode = 'listo'; head.wait = performance.now() + 7000; return; }
    var b = blocks[head.block];
    head.tx = b.x; head.ty = b.y; head.mode = 'viaja'; head.cell = 0;
  }

  // ---------- Conexiones ----------
  function makeLink(a, b, prog) {
    var pad = 14, m = 22;
    function caja(k) { return { l: k.x - pad, r: k.x + k.w + pad, t: k.y - pad, b: k.y + k.h + pad, cx: k.x + k.w / 2, cy: k.y + k.h / 2 }; }
    var A = caja(a), B = caja(b);
    function puertos(K) { return [{ p: [K.r, K.cy], d: [1, 0] }, { p: [K.l, K.cy], d: [-1, 0] }, { p: [K.cx, K.t], d: [0, -1] }, { p: [K.cx, K.b], d: [0, 1] }]; }
    function cruza(q) {
      var sx = safe.x - 10, sy = safe.y - 10, sw = safe.w + 20, sh = safe.h + 20;
      for (var j = 1; j < q.length; j++) {
        var x1 = Math.min(q[j - 1][0], q[j][0]), x2 = Math.max(q[j - 1][0], q[j][0]);
        var y1 = Math.min(q[j - 1][1], q[j][1]), y2 = Math.max(q[j - 1][1], q[j][1]);
        if (x2 >= sx && x1 <= sx + sw && y2 >= sy && y1 <= sy + sh) return true;
        if (x1 < 4 || x2 > W - 4 || y1 < 70 || y2 > H - 60) return true;
      }
      return false;
    }
    function largo(q) { var L = 0; for (var j = 1; j < q.length; j++) L += Math.abs(q[j][0] - q[j - 1][0]) + Math.abs(q[j][1] - q[j - 1][1]); return L; }
    var mejor = null, mejorL = 1e9;
    var carriles = [safe.y - 34, safe.y + safe.h + 34, safe.x - 34, safe.x + safe.w + 34];
    puertos(A).forEach(function (pa) {
      puertos(B).forEach(function (pb) {
        var s0 = [pa.p[0] + pa.d[0] * m, pa.p[1] + pa.d[1] * m], e0 = [pb.p[0] + pb.d[0] * m, pb.p[1] + pb.d[1] * m];
        var cands = [
          [pa.p, s0, [e0[0], s0[1]], e0, pb.p],
          [pa.p, s0, [s0[0], e0[1]], e0, pb.p]
        ];
        carriles.forEach(function (c, k) {
          if (k < 2) cands.push([pa.p, s0, [s0[0], c], [e0[0], c], e0, pb.p]);
          else cands.push([pa.p, s0, [c, s0[1]], [c, e0[1]], e0, pb.p]);
        });
        cands.forEach(function (q) {
          // quita puntos repetidos o alineados
          var r = [q[0]];
          for (var j = 1; j < q.length; j++) { var pr = r[r.length - 1]; if (Math.abs(q[j][0] - pr[0]) + Math.abs(q[j][1] - pr[1]) > 0.5) r.push(q[j]); }
          if (cruza(r)) return;
          var L = largo(r) + r.length * 30;
          if (L < mejorL) { mejorL = L; mejor = r; }
        });
      });
    });
    var p = mejor || [[A.r, A.cy], [B.l, B.cy]];
    return { p: p, len: largo(p), prog: prog || 0 };
  }
  function pointAt(l, d) {
    for (var i = 1; i < l.p.length; i++) {
      var a = l.p[i - 1], b = l.p[i], s = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
      if (d <= s) { var k = s ? d / s : 0; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
      d -= s;
    }
    return l.p[l.p.length - 1];
  }

  // ---------- Dibujo ----------
  function fadeAt(x, y) {
    // las tiras se apagan sobre el título para que se lea limpio
    var dx = Math.max(safe.x - x, 0, x - (safe.x + safe.w)), dy = Math.max(safe.y - y, 0, y - (safe.y + safe.h));
    var d = Math.hypot(dx, dy); return Math.min(1, d / 120);
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawGlyph(t, g, x, y, size, color, alpha) {
    if (alpha <= 0.02) return;
    ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.strokeStyle = color;
    if (t === 'cubo') { var s = size * 0.5; rr(x - s / 2, y - s / 2, s, s, s * 0.28); ctx.fill(); }
    else if (t === 'rombo') { var r = size * 0.3; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.14; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else { ctx.fillText(g, x, y); }
  }
  function drawStreams(t) {
    ctx.font = '600 ' + GL + 'px "Fredoka", "Mluvka", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    streams.forEach(function (s) {
      var shift = (s.off + t * s.speed) % 1;
      for (var i = 0; i < s.n; i++) {
        var u = (i / s.n + shift) % 1;
        var p = bez(s, u), x = p[0], y = p[1];
        var dx = x - pointer.x, dy = y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < 22000) { var d = Math.sqrt(d2) || 1; x += dx / d * (1 - d / 148) * 40; y += dy / d * (1 - d / 148) * 40; }
        var edge = Math.min(u, 1 - u) * 8; // aparecen y desaparecen en los extremos
        drawGlyph(s.tipo, s.gl[i], x, y, GL, s.color, Math.min(1, edge) * fadeAt(x, y));
      }
    });
    ctx.globalAlpha = 1;
  }
  function drawBlocks(t) {
    ctx.font = '600 ' + Math.round(CELL * 0.95) + 'px "Fredoka", "Mluvka", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    blocks.forEach(function (b) {
      if (!b.cells.length) return;
      // fondo y marco del bloque
      var pad = 14, R = (b.h + pad * 2) / 2;
      ctx.globalAlpha = 1; ctx.fillStyle = '#FFFFFF'; rr(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2, R); ctx.fill();
      ctx.globalAlpha = b.done ? 1 : 0.6; ctx.strokeStyle = b.done ? '#111111' : '#ADA79E'; ctx.lineWidth = 1.4;
      rr(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2, R); ctx.stroke();
      b.cells.forEach(function (c) {
        var col = TINTA;
        drawGlyph(c.t, c.g, b.x + c.c * CW + CW / 2, b.y + c.r * CELL + CELL / 2, CELL, col, c.a);
      });
      ctx.globalAlpha = 1;
      if (b.done) { ctx.fillStyle = ACENTO; ctx.beginPath(); ctx.arc(b.x + b.w + 14, b.y - 12, 4.5, 0, 6.283); ctx.fill(); }
    });
  }
  function drawLinks(t) {
    links.forEach(function (l) {
      var upto = l.len * l.prog;
      ctx.strokeStyle = '#111111'; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.85; ctx.lineCap = 'round';
      ctx.setLineDash([upto, l.len + 40]);
      ctx.beginPath(); ctx.moveTo(l.p[0][0], l.p[0][1]);
      for (var i = 1; i < l.p.length - 1; i++) {
        var pa = l.p[i - 1], pc = l.p[i], pn = l.p[i + 1];
        var la = Math.abs(pc[0] - pa[0]) + Math.abs(pc[1] - pa[1]), ln = Math.abs(pn[0] - pc[0]) + Math.abs(pn[1] - pc[1]);
        var rad = Math.min(16, la / 2, ln / 2);

      if (l.prog >= 1) { var u = l.p[l.p.length - 1]; ctx.beginPath(); ctx.arc(u[0], u[1], 3.5, 0, 6.283); ctx.fill(); }

      var l = links[p.l]; if (!l || l.prog < 1) return;
      var pt = pointAt(l, p.d); ctx.fillStyle = ACENTO; ctx.beginPath(); ctx.arc(pt[0], pt[1], 4, 0, 6.283); ctx.fill();
    });
  }
  function drawParticles() {
    ctx.font = '500 11px "JetBrains Mono", monospace';
    particles.forEach(function (p) { var sz = GL + (CELL - GL) * p.e; ctx.font = '600 ' + Math.round(sz * 0.95) + 'px "Fredoka", "Mluvka", sans-serif'; drawGlyph(p.t, p.g, p.x, p.y, sz, '#3A3734', Math.max(0.08, fadeAt(p.x, p.y))); });

  }
  function drawHead(t) {
    if (head.mode === 'listo' || reduce) return;
    var x = head.x, y = head.y;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#111111'; rr(-14, -CELL / 2 - 16, 28, 12, 6); ctx.fill();
    ctx.fillStyle = ACENTO; ctx.beginPath(); ctx.arc(0, -CELL / 2 - 2, 3, 0, 6.283); ctx.fill();

    ctx.restore();

  // ---------- Bucle ----------
  var last = 0;
  function frame(t) {

  function update(t, dt) {
    var b = blocks[head.block];
    if (head.mode === 'viaja' && b) {
      head.x += (head.tx + CELL / 2 - head.x) * 0.09; head.y += (head.ty + CELL / 2 - head.y) * 0.09;
      if (Math.abs(head.x - head.tx - CELL / 2) < 1.5 && Math.abs(head.y - head.ty - CELL / 2) < 1.5) { head.mode = 'imprime'; head.wait = t; }
    } else if (head.mode === 'imprime' && b) {
      if (t >= head.wait) {
        // un paso por celda, de ida y vuelta en cada fila, como un cabezal de impresora
        var total = b.cols * b.rows;
        if (head.cell >= total) {
          b.done = true;
          if (head.block > 0) links.push(makeLink(blocks[head.block - 1], b, 0));
          
          nextBlock();
        } else {
          var r = Math.floor(head.cell / b.cols), k = head.cell % b.cols, c = r % 2 ? b.cols - 1 - k : k;
          head.x = b.x + c * CW + CW / 2; head.y = b.y + r * CELL + CELL / 2;
          var txt = streams.filter(function (x) { return x.tipo === 'texto'; }); var s = pick(txt.length ? txt : streams), u = 0.15 + Math.random() * 0.7, from = bez(s, u);
          var cell = { r: r, c: c, t: cellType(b, r), g: cellGlyph(b, r, c), a: 0 };
          b.cells.push(cell);
          particles.push({ x: from[0], y: from[1], sx: from[0], sy: from[1], ex: head.x, ey: head.y, t0: t, dur: 420, t: cell.t, g: cell.g, cell: cell });
          head.cell++; head.wait = t + 110;
        }
      }
    } else if (head.mode === 'listo' && t > head.wait) {
      start(); return;
    }
    // partículas que vuelan hacia su celda
    particles = particles.filter(function (p) {
      var k = Math.min(1, (t - p.t0) / p.dur), e = 1 - Math.pow(1 - k, 3);
      p.e = e; p.x = p.sx + (p.ex - p.sx) * e; p.y = p.sy + (p.ey - p.sy) * e;
      if (k >= 1) { p.cell.a = 1; return false; }
      return true;
    });
    links.forEach(function (l) { if (l.prog < 1) l.prog = Math.min(1, l.prog + dt / 900); });
    if (links.length && Math.random() < 0.04) pulses.push({ l: Math.floor(Math.random() * links.length), d: 0 });
    pulses = pulses.filter(function (p) { var l = links[p.l]; if (!l || l.prog < 1) return true; p.d += dt * 0.18; return p.d < l.len; });
  }

    if (hit) { out.append('Eso lo teje la pieza '); var b = document.createElement('b'); b.textContent = hit.n; out.append(b, '. La conectamos con las demás.'); }
    else out.textContent = 'Todavía no tenemos esa pieza. Una persona del equipo lo revisa contigo.';
    // la frase entra al primer bloque y el cabezal vuelve a empezar

    var s = makeStream(); s.tipo = 'texto'; s.gl = Array.from((v + ' ').repeat(12)).slice(0, s.n); s.color = '#8E8A84'; streams.push(s);
    start();
  });

  ];
